name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libsecret-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Types
        run: npm run check

      - name: Frontend tests
        run: npm test

      - name: Build the frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The Arch package builds with this exact feature set: without
      # `tauri/custom-protocol` the binary looks for a dev server at runtime.
      - name: Package build
        run: cargo build --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
