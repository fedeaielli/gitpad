[package]
name = "gitpad"
version = "1.0.6"
description = "Markdown notes in a Git repository you own"
authors = ["Fede <fedeaielli@users.noreply.github.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/fedeaielli/gitpad"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "gitpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2" # one window per repository
tauri-plugin-opener = "2"       # open verification_uri in the browser
tauri-plugin-dialog = "2"      # native picker for importing files/folders
tauri-plugin-log = "2"         # file log, so a bug report can carry one
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# default-features = false drops libssh2 (SSH is not used); `https` keeps HTTPS push.
git2 = { version = "0.20", default-features = false, features = ["https"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ignore = "0.4"
nix = { version = "0.29", features = ["signal"] }

[profile.release]
lto = "thin"
strip = true
